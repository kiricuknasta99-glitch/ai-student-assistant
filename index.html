<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Student Assistant</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 40px;
    text-align: center;
}

.container{
    background: white;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

textarea{
    width: 100%;
    height: 120px;
    margin-top: 10px;
}

button{
    margin-top: 15px;
    padding: 10px 20px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background: #45a049;
}

#result{
    margin-top: 20px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Помічник Студента</h1>

<p>Введіть тему:</p>

<textarea id="topic"></textarea>

<br>

<button onclick="generateSummary()">
Створити конспект
</button>

<div id="result"></div>

</div>

<script>
function generateSummary(){

let topic = document.getElementById("topic").value;

document.getElementById("result").innerHTML =
"<h3>Конспект</h3>" +
"<p>Стислий опис теми: <b>" +
topic +
"</b>. Це демонстраційна версія AI-помічника для студентів, створена в рамках навчального проєкту.</p>";

}
</script>

</body>
</html>
